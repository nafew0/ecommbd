# Weekly pull requests for dependency updates. All Vendure packages move together in one PR
# (README.md, "Staying on upstream Vendure"); GitHub also alerts on known vulnerabilities.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vendure:
        patterns: ['@vendure/*']
      dev-tools:
        dependency-type: development
    # Vendure 3.8's job queue (BullMQJobQueuePlugin) supports only bullmq 5 and ioredis 5. Remove
    # these once a Vendure upgrade moves to the next major version.
    ignore:
      - dependency-name: bullmq
        update-types: ['version-update:semver-major']
      - dependency-name: ioredis
        update-types: ['version-update:semver-major']
      # Vendure 3.8's Dashboard is built for Vite 7, and @vitejs/plugin-react's next major needs
      # Vite 8, so they move together with a Vendure upgrade.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # Matches the Node version we run (.nvmrc, Node 24). Move it with a Node upgrade.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
