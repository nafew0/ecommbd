type Query {
  """The active Channel"""
  activeChannel: Channel!

  """The active Customer"""
  activeCustomer: Customer

  """
  The active Order. Will be `null` until an Order is created via `addItemToOrder`. Once an Order reaches the
  state of `PaymentAuthorized` or `PaymentSettled`, then that Order is no longer considered "active" and this
  query will once again return `null`.
  """
  activeOrder: Order

  """An array of supported Countries"""
  availableCountries: [Country!]!

  """A list of Collections available to the shop"""
  collections(options: CollectionListOptions): CollectionList!

  """
  Returns a Collection either by its id or slug. If neither 'id' nor 'slug' is specified, an error will result.
  """
  collection(id: ID, slug: String): Collection

  """
  Returns a list of eligible shipping methods based on the current active Order
  """
  eligibleShippingMethods: [ShippingMethodQuote!]!

  """
  Returns a list of payment methods and their eligibility based on the current active Order
  """
  eligiblePaymentMethods: [PaymentMethodQuote!]!

  """A list of Facets available to the shop"""
  facets(options: FacetListOptions): FacetList!

  """Returns a Facet by its id"""
  facet(id: ID!): Facet

  """Returns information about the current authenticated User"""
  me: CurrentUser

  """
  Returns the possible next states that the activeOrder can transition to
  """
  nextOrderStates: [String!]!

  """
  Returns an Order based on the id. Note that in the Shop API, only orders belonging to the
  currently-authenticated User may be queried.
  """
  order(id: ID!): Order

  """
  Returns an Order based on the order `code`. For guest Orders (i.e. Orders placed by non-authenticated Customers)
  this query will only return the Order within 2 hours of the Order being placed. This allows an Order confirmation
  screen to be shown immediately after completion of a guest checkout, yet prevents security risks of allowing
  general anonymous access to Order data.
  """
  orderByCode(code: String!): Order

  """
  Get a Product either by id or slug. If neither 'id' nor 'slug' is specified, an error will result.
  """
  product(id: ID, slug: String): Product

  """Get a list of Products"""
  products(options: ProductListOptions): ProductList!

  """Search Products based on the criteria set by the `SearchInput`"""
  search(input: SearchInput!): SearchResponse!

  """Get active payment methods"""
  activePaymentMethods: [PublicPaymentMethod]!

  """Get active shipping methods"""
  activeShippingMethods: [PublicShippingMethod]!

  """
  All 64 districts, sorted by name. lang defaults to the request's languageCode.
  """
  bdDistricts(lang: BdGeoLanguage): [BdDistrict!]!

  """
  Upazilas and city areas of a district, sorted by name. Unknown district: an empty list.
  """
  bdThanas(districtId: String!, lang: BdGeoLanguage): [BdThana!]!

  """Version of the place data. Changes when places are added or renamed."""
  bdGeoDataVersion: String!
  bdStoreSettings: BdPublicStoreSettings!
  bdCheckoutSettings: BdCheckoutSettings!

  """An enabled page with this slug in any language"""
  bdPage(slug: String!): BdPage

  """Enabled pages, for the sitemap"""
  bdPages: [BdPage!]!

  """In the request's language"""
  bdMenus: BdMenus!

  """
  What an unknown product, collection or page slug means: moved (with the current slug) or gone
  """
  bdSlugLookup(type: String!, slug: String!): BdSlugLookup

  """How the active order can be paid; null without an active order"""
  bdPaymentOptions: BdPaymentOptions
  bdMetaConfig: BdMetaConfig!
  bdSearch(input: BdSearchInput!): BdSearchResult!

  """
  For the search box: up to 6 products and 3 categories; empty below 2 characters
  """
  bdSearchSuggestions(term: String!): BdSearchSuggestions!

  """
  Both must match; any miss is null. Rate-limited per address and per phone.
  """
  bdTrackOrder(orderNumber: String!, phone: String!): BdTrackedOrder

  """The link in the shipped SMS (/t/<token>)"""
  bdTrackOrderByToken(token: String!): BdTrackedOrder

  """
  The published sections of the home page, the product page template or a page; null when none are published
  """
  bdLayout(type: String!, pageId: ID): BdLayout

  """
  A layout's draft, for a valid preview token; null when the token is wrong or expired
  """
  bdLayoutPreview(token: String!): BdLayoutPreview

  """ThemeSettings from @ecommbd/sections"""
  bdTheme: JSON!

  """
  A sales page by its address; null when there's none, it's off, or its product is gone. preview: a preview token for its draft
  """
  bdSalesPage(slug: String!, preview: String): BdShopSalesPage
}

