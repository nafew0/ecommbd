  Adds mutliple items to the Order. Returns a list of errors for each item that failed to add. It will still add successful items.
  """
  addItemsToOrder(inputs: [AddItemInput!]!): UpdateMultipleOrderItemsResult!

  """Remove an OrderLine from the Order"""
  removeOrderLine(orderLineId: ID!): RemoveOrderItemsResult!

  """Remove all OrderLine from the Order"""
  removeAllOrderLines: RemoveOrderItemsResult!

  """
  Adjusts an OrderLine. If custom fields are defined on the OrderLine entity, a third argument 'customFields' of type `OrderLineCustomFieldsInput` will be available.
  """
  adjustOrderLine(orderLineId: ID!, quantity: Int!): UpdateOrderItemsResult!

  """Applies the given coupon code to the active Order"""
  applyCouponCode(couponCode: String!): ApplyCouponCodeResult!

  """Removes the given coupon code from the active Order"""
  removeCouponCode(couponCode: String!): Order

  """
  Transitions an Order to a new state. Valid next states can be found by querying `nextOrderStates`
  """
  transitionOrderToState(state: String!): TransitionOrderToStateResult

  """Sets the shipping address for the active Order"""
  setOrderShippingAddress(input: CreateAddressInput!): ActiveOrderResult!

  """Sets the billing address for the active Order"""
  setOrderBillingAddress(input: CreateAddressInput!): ActiveOrderResult!

  """
  Unsets the shipping address for the active Order. Available since version 3.1.0
  """
  unsetOrderShippingAddress: ActiveOrderResult!

  """
  Unsets the billing address for the active Order. Available since version 3.1.0
  """
  unsetOrderBillingAddress: ActiveOrderResult!

  """Allows any custom fields to be set for the active Order"""
  setOrderCustomFields(input: UpdateOrderInput!): ActiveOrderResult!

  """
  Sets the shipping method by id, which can be obtained with the `eligibleShippingMethods` query.
  An Order can have multiple shipping methods, in which case you can pass an array of ids. In this case,
  you should configure a custom ShippingLineAssignmentStrategy in order to know which OrderLines each
  shipping method will apply to.
  """
  setOrderShippingMethod(shippingMethodId: [ID!]!): SetOrderShippingMethodResult!

  """Sets the currency code for the active Order"""
  setCurrencyCodeForOrder(currencyCode: CurrencyCode!): UpdateOrderItemsResult!

  """Add a Payment to the Order"""
  addPaymentToOrder(input: PaymentInput!): AddPaymentToOrderResult!

  """
  Set the Customer for the Order. Required only if the Customer is not currently logged in
  """
  setCustomerForOrder(input: CreateCustomerInput!): SetCustomerForOrderResult!

  """
  Authenticates the user using the native authentication strategy. This mutation is an alias for authenticate({ native: { ... }})
  
  The `rememberMe` option applies when using cookie-based sessions, and if `true` it will set the maxAge of the session cookie
  to 1 year.
  """
  login(username: String!, password: String!, rememberMe: Boolean): NativeAuthenticationResult!

  """Authenticates the user using a named authentication strategy"""
  authenticate(input: AuthenticationInput!, rememberMe: Boolean): AuthenticationResult!

  """End the current authenticated session"""
  logout: Success!

  """
  Register a Customer account with the given credentials. There are four possible registration flows:
  
  _If `authOptions.requireVerification` is set to `true`:_
  
  1. **The Customer is registered _with_ a password**. A verificationToken will be created (and typically emailed to the Customer). That
     verificationToken would then be passed to the `verifyCustomerAccount` mutation _without_ a password. The Customer is then
     verified and authenticated in one step.
  2. **The Customer is registered _without_ a password**. A verificationToken will be created (and typically emailed to the Customer). That
     verificationToken would then be passed to the `verifyCustomerAccount` mutation _with_ the chosen password of the Customer. The Customer is then
     verified and authenticated in one step.
  
  _If `authOptions.requireVerification` is set to `false`:_
  
  3. The Customer _must_ be registered _with_ a password. No further action is needed - the Customer is able to authenticate immediately.
  
  _Whatever the setting, if an account already exists for the email address through another authentication strategy
  (for example an SSO provider) and has no password yet:_
  
  4. **The supplied password is never stored.** A verificationToken is created and emailed to the address, and this mutation
     answers with a generic success so that it does not reveal whether the account exists. The password is set only when that
     token is passed to the `verifyCustomerAccount` mutation _with_ the chosen password, which proves the caller controls the
     mailbox. This holds even when `requireVerification` is `false`, so the Customer cannot be authenticated straight after
     registering. Registering again issues a fresh token and sends the email again.
  
  In every flow the caller-supplied `firstName`, `lastName`, `phoneNumber` and custom fields are ignored whenever a User already
  exists for the email address, since the caller has not proven they own it. This includes an account an administrator created
  earlier. A Customer with no User, such as one left by a guest checkout, is not an account and its details are still filled in.
  """
  registerCustomerAccount(input: RegisterCustomerInput!): RegisterCustomerAccountResult!

  """
  Regenerate and send a verification token for a new Customer registration. Only applicable if `authOptions.requireVerification` is set to true.
  """
  refreshCustomerVerification(emailAddress: String!): RefreshCustomerVerificationResult!

  """Update an existing Customer"""
  updateCustomer(input: UpdateCustomerInput!): Customer!

  """Create a new Customer Address"""
  createCustomerAddress(input: CreateAddressInput!): Address!

  """Update an existing Address"""
  updateCustomerAddress(input: UpdateAddressInput!): Address!

  """Delete an existing Address"""
  deleteCustomerAddress(id: ID!): Success!

  """
  Verify a Customer email address with the token sent to that address. Applicable whenever a verificationToken was issued:
  that is when `authOptions.requireVerification` is set to true, and also when a password was registered against an account
  that already existed through another authentication strategy, whatever that setting is.
  
  If the Customer was not registered with a password in the `registerCustomerAccount` mutation, the password _must_ be
  provided here.
  """
  verifyCustomerAccount(token: String!, password: String): VerifyCustomerAccountResult!

  """Update the password of the active Customer"""
  updateCustomerPassword(currentPassword: String!, newPassword: String!): UpdateCustomerPasswordResult!

  """
  Request to update the emailAddress of the active Customer. If `authOptions.requireVerification` is enabled
  (as is the default), then the `identifierChangeToken` will be assigned to the current User and
  a IdentifierChangeRequestEvent will be raised. This can then be used e.g. by the EmailPlugin to email
  that verification token to the Customer, which is then used to verify the change of email address.
  """
  requestUpdateCustomerEmailAddress(password: String!, newEmailAddress: String!): RequestUpdateCustomerEmailAddressResult!

  """
  Confirm the update of the emailAddress with the provided token, which has been generated by the
  `requestUpdateCustomerEmailAddress` mutation.
  """
  updateCustomerEmailAddress(token: String!): UpdateCustomerEmailAddressResult!

  """Requests a password reset email to be sent"""
  requestPasswordReset(emailAddress: String!): RequestPasswordResetResult

  """Resets a Customer's password based on the provided token"""
  resetPassword(token: String!, password: String!): ResetPasswordResult!

  """
  Finds the customer by phone (or creates one) and attaches them to the active order. No email needed.
  """
  setCustomerForOrderByPhone(input: SetCustomerForOrderByPhoneInput!): SetCustomerForOrderByPhoneResult!

  """
  Sets the delivery address from a district and thana, and the order note.
  """
  setOrderShippingAddressBD(input: SetOrderShippingAddressBDInput!): SetOrderShippingAddressBDResult!

  """
  cod or prepaid: puts the right COD charge on the active order. Call it before paying.
  """
  setBdPaymentChoice(choice: String!): Order

  """
  Saves the checkout as the shopper types (debounced), for staff to follow up if they leave. Always true.
  """
  saveCheckoutProgress(input: BdCheckoutProgressInput!): Boolean!

  """
  Sends a 6-digit code by SMS to the active order's phone, when COD needs one (bdPaymentOptions.codOtpRequired)
  """
  sendBdOtp: BdOtpResult!
  verifyBdOtp(code: String!): BdOtpResult!

  """
  No code arrived: order anyway, marked not verified (only when the store allows it, a minute after a code was sent)
  """
  skipBdOtp: BdOtpResult!

  """
  Saves the Meta cookies and browser on the active order at checkout, for a Purchase sent later
  """
  setBdMetaBrowser(input: BdMetaBrowserInput!): Boolean!

  """
  Replaces the active order's items with a sales page's product (a pack or a quantity) and its add-on
  """
  setBdSalesPageOrder(input: BdSalesOrderInput!): BdSalesOrderResult!

  """
  Saves where the shopper came from on the active order; values are cut to safe lengths
  """
  setBdOrderAttribution(input: BdAttributionInput!): Boolean!
}

