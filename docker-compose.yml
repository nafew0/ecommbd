# Local development services. Ports are offset so they don't clash with a
# PostgreSQL or Redis already running on this machine.
services:
  # The storefront cache (phase 17), only with `docker compose --profile speed up -d varnish`.
  # See docs/runbooks/storefront-cache.md.
  varnish:
    profiles: [speed]
    build: ./infra/varnish
    environment:
      STOREFRONT_HOST: host.docker.internal
      STOREFRONT_PORT: ${STOREFRONT_PORT:-4321}
      # Required, the same as the core's (openssl rand -hex 32): Varnish refuses to start without a
      # real one. No `:?` here, so `npm run services:up` still works without the speed profile.
      CACHE_PURGE_SECRET: ${CACHE_PURGE_SECRET:-}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports:
      - '127.0.0.1:${VARNISH_PORT:-6081}:80'
      # The purge listener: on this machine's loopback only, never on a public address.
      - '127.0.0.1:${VARNISH_PURGE_PORT:-6082}:6082'
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommbd
      POSTGRES_PASSWORD: ecommbd
      POSTGRES_DB: ecommbd
    ports:
      - '54320:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Job queues (BullMQ): must never evict keys.
  redis-queue:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '63790:6379'
    volumes:
      - redis-queue-data:/data

  # Cache: evicts least-recently-used keys, no persistence.
  redis-cache:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    ports:
      - '63791:6379'

volumes:
  postgres-data:
  redis-queue-data:
